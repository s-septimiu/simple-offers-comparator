// PFA, sistem real. Input & output in RON.
function pfaTax(netIncomeRON, mode, flatPct) {
  if (netIncomeRON <= 0) return {
    cas: 0,
    cass: 0,
    tax: 0,
    total: 0

  if (mode === "flat") {
    const total = netIncomeRON * (flatPct / 100);

      cas: 0,
      cass: 0,

  return {
    cas,
    cass,
    tax,
    total: cas + cass + tax

}
// CIM. Personal deduction is ~0 at senior gross levels, so net is linear in gross.

    cass,
